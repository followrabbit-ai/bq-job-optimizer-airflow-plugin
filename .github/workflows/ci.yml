name: CI

on:
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - master
      - main

jobs:
  lint-and-format:
    name: Lint and Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install black ruff

      - name: Check formatting with Black
        run: |
          black --check --diff bq-job-optimizer-airflow-2/*.py

      - name: Lint with Ruff
        run: |
          ruff check bq-job-optimizer-airflow-2/*.py

  test:
    name: Airflow ${{ matrix.airflow-version }} / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      # Report every combination rather than cancelling siblings on first failure.
      fail-fast: false
      matrix:
        include:
          # Baseline Airflow, full Python fan-out (unchanged coverage).
          - { airflow-version: '2.9.1', python-version: '3.9' }
          - { airflow-version: '2.9.1', python-version: '3.10' }
          - { airflow-version: '2.9.1', python-version: '3.11' }
          - { airflow-version: '2.9.1', python-version: '3.12' }
          # Newer Airflow 2.x. One Python each keeps the matrix cheap; these pull
          # much newer apache-airflow-providers-google (12.0.0 and 20.0.0), which
          # is the dependency that actually governs plugin compatibility.
          - { airflow-version: '2.10.5', python-version: '3.12' }
          - { airflow-version: '2.11.2', python-version: '3.12' }

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        env:
          AIRFLOW_VERSION: ${{ matrix.airflow-version }}
        run: |
          python -m pip install --upgrade pip
          PY_VERSION=$(python -c "import sys; print(f'{sys.version_info[0]}.{sys.version_info[1]}')")
          CONSTRAINT_URL="https://raw.githubusercontent.com/apache/airflow/constraints-${AIRFLOW_VERSION}/constraints-${PY_VERSION}.txt"
          echo "Using constraint file: ${CONSTRAINT_URL}"
          pip install "apache-airflow==${AIRFLOW_VERSION}" --constraint "${CONSTRAINT_URL}"
          pip install -r bq-job-optimizer-airflow-2/test_requirements.txt --constraint "${CONSTRAINT_URL}"
          pip install --constraint "${CONSTRAINT_URL}" google-auth-httplib2 google-api-python-client pandas-gbq gcloud-aio-bigquery gcloud-aio-storage google-cloud-secret-manager google-cloud-storage
          pip install --constraint "${CONSTRAINT_URL}" -e .

      - name: Record resolved versions
        run: |
          python -c "import airflow; print('apache-airflow', airflow.__version__)"
          python -c "from importlib.metadata import version; print('apache-airflow-providers-google', version('apache-airflow-providers-google'))"

      - name: Set up Airflow
        run: |
          export AIRFLOW_HOME=$(pwd)/airflow_home
          mkdir -p $AIRFLOW_HOME/dags
          cp bq-job-optimizer-airflow-2/test_dag.py $AIRFLOW_HOME/dags/
          airflow db init
          echo -e "admin\nadmin\nAdmin\nUser\nadmin@example.com\n" | airflow users create --username admin --firstname Admin --lastname User --role Admin --email admin@example.com || true
          airflow connections add rabbit_api --conn-type generic --conn-password "test-key" --conn-extra '{"api_base_url": "https://api.followrabbit.ai/bq-job-optimizer"}' || true
          airflow variables set rabbit_bq_optimizer_config '{"enabled": true, "default_pricing_mode": "on_demand", "reservation_ids": ["project:us-central1.test-reservation"]}' || true
        env:
          AIRFLOW_HOME: ${{ github.workspace }}/airflow_home

      - name: Run connection test
        run: |
          export AIRFLOW_HOME=$(pwd)/airflow_home
          python bq-job-optimizer-airflow-2/test_plugin_connection.py
        env:
          AIRFLOW_HOME: ${{ github.workspace }}/airflow_home

      - name: Run DAG execution test
        run: |
          export AIRFLOW_HOME=$(pwd)/airflow_home
          python bq-job-optimizer-airflow-2/test_dag_execution.py
        env:
          AIRFLOW_HOME: ${{ github.workspace }}/airflow_home

      - name: Run DAG whitelist test
        run: |
          export AIRFLOW_HOME=$(pwd)/airflow_home
          python bq-job-optimizer-airflow-2/test_dag_whitelist.py
        env:
          AIRFLOW_HOME: ${{ github.workspace }}/airflow_home

      - name: Run plugin optimization tests
        run: |
          export AIRFLOW_HOME=$(pwd)/airflow_home
          python -m unittest bq-job-optimizer-airflow-2/test_plugin_optimization.py
        env:
          AIRFLOW_HOME: ${{ github.workspace }}/airflow_home
