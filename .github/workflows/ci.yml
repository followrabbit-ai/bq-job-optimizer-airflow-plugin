name: CI

on:
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - master
      - main
  # Weekly run so a new Airflow release that breaks the plugin shows up without a PR
  # (see the "latest" row in the matrix).
  schedule:
    - cron: '0 5 * * 1'
  workflow_dispatch:

# A newer push to the same branch or PR cancels the run it supersedes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-format:
    name: Lint and Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install black ruff

      - name: Check formatting with Black
        run: |
          black --check --diff bq-job-optimizer-airflow

      - name: Lint with Ruff
        run: |
          ruff check bq-job-optimizer-airflow

  test:
    name: Airflow ${{ matrix.airflow-version }} / Python ${{ matrix.python-version }}
    # Pinned: setup-python has no Python 3.9 build for Ubuntu 26.04 (ubuntu-latest).
    runs-on: ubuntu-24.04
    # The "latest" row tracks whatever Airflow released last. On pushes and PRs it reports
    # without blocking; on the weekly run it fails the workflow, so a breaking Airflow release
    # sends a failure notification.
    continue-on-error: ${{ matrix.airflow-version == 'latest' && github.event_name != 'schedule' }}
    strategy:
      # Report every combination rather than cancelling siblings on first failure.
      fail-fast: false
      matrix:
        include:
          # Every row runs the unit tests and the end-to-end test (a real Airflow running a
          # DAG against a fake BigQuery and a fake Rabbit API). What governs compatibility is
          # the apache-airflow-providers-google version each Airflow constraint file pins,
          # noted per row.

          # Airflow 2 baseline, full Python fan-out. providers-google 10.17.
          - { airflow-version: '2.9.1', python-version: '3.9' }
          - { airflow-version: '2.9.1', python-version: '3.10' }
          - { airflow-version: '2.9.1', python-version: '3.11' }
          - { airflow-version: '2.9.1', python-version: '3.12' }
          # Newer Airflow 2.x. providers-google 12.0 and 20.0.
          - { airflow-version: '2.10.5', python-version: '3.12' }
          - { airflow-version: '2.11.2', python-version: '3.12' }
          # Oldest Python Airflow 2.11 supports, against the newest providers.
          - { airflow-version: '2.11.2', python-version: '3.10' }
          # Airflow 3: one row per minor line. providers-google 20.0 to 22.8.
          - { airflow-version: '3.1.8', python-version: '3.12' }
          - { airflow-version: '3.2.2', python-version: '3.12' }
          - { airflow-version: '3.3.2', python-version: '3.12' }
          - { airflow-version: '3.4.0', python-version: '3.12' }
          # Oldest Python of the oldest supported Airflow 3 (3.4 needs Python 3.11+), and the
          # oldest and newest Python of the newest pinned one.
          - { airflow-version: '3.1.8', python-version: '3.10' }
          - { airflow-version: '3.4.0', python-version: '3.11' }
          - { airflow-version: '3.4.0', python-version: '3.13' }
          # Newest Airflow on PyPI, unpinned (non-blocking).
          - { airflow-version: 'latest', python-version: '3.12' }

    services:
      # Metadata database for the end-to-end test, so tasks run in parallel (LocalExecutor).
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: airflow
          POSTGRES_PASSWORD: airflow
          POSTGRES_DB: airflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U airflow"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      # uv resolves and installs Airflow several times faster than pip.
      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: |
            setup.py
            bq-job-optimizer-airflow/test_requirements.txt
            .github/workflows/ci.yml

      - name: Install dependencies
        env:
          AIRFLOW_VERSION: ${{ matrix.airflow-version }}
          UV_SYSTEM_PYTHON: '1'
        run: |
          if [ "${AIRFLOW_VERSION}" = "latest" ]; then
            curl -fsSL -o "${RUNNER_TEMP}/airflow.json" https://pypi.org/pypi/apache-airflow/json
            AIRFLOW_VERSION=$(python -c "import json, sys; print(json.load(open(sys.argv[1]))['info']['version'])" "${RUNNER_TEMP}/airflow.json")
          fi
          PY_VERSION=$(python -c "import sys; print(f'{sys.version_info[0]}.{sys.version_info[1]}')")
          CONSTRAINT_URL="https://raw.githubusercontent.com/apache/airflow/constraints-${AIRFLOW_VERSION}/constraints-${PY_VERSION}.txt"
          echo "Using constraint file: ${CONSTRAINT_URL}"
          uv pip install --constraint "${CONSTRAINT_URL}" \
            "apache-airflow[postgres]==${AIRFLOW_VERSION}" \
            -r bq-job-optimizer-airflow/test_requirements.txt \
            google-auth-httplib2 google-api-python-client pandas-gbq gcloud-aio-bigquery gcloud-aio-storage google-cloud-secret-manager google-cloud-storage \
            -e .

      - name: Record resolved versions
        run: |
          python -c "import airflow; print('apache-airflow', airflow.__version__)"
          python -c "from importlib.metadata import version; print('apache-airflow-providers-google', version('apache-airflow-providers-google'))"

      - name: Unit tests
        run: bq-job-optimizer-airflow/run_tests.sh unit

      - name: End-to-end test (live Airflow, fake BigQuery and Rabbit API)
        run: bq-job-optimizer-airflow/run_tests.sh e2e
        env:
          AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@localhost:5432/airflow
          AIRFLOW__CORE__EXECUTOR: LocalExecutor
          RABBIT_E2E_HOME: ${{ runner.temp }}/rabbit-e2e

      - name: Upload Airflow logs from the end-to-end test
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-logs-airflow-${{ matrix.airflow-version }}-py${{ matrix.python-version }}
          path: ${{ runner.temp }}/rabbit-e2e
          if-no-files-found: ignore
